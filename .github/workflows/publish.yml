name: Publish

on:
  release:
    # Fire only when a release is actually published, not on drafts/prereleases.
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    # `release: published` also fires for prereleases; only full releases publish.
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # The tag must name the version the build will publish.
      - name: Check release tag matches Configuration.VERSION
        if: github.event_name == 'release'
        run: |
          declared=$(sed -n 's/.*const val VERSION = "\(.*\)".*/\1/p' buildSrc/src/main/kotlin/io/github/androidpoet/weekview/Configuration.kt)
          tag="${{ github.event.release.tag_name }}"
          if [ "v$declared" != "$tag" ] && [ "$declared" != "$tag" ]; then
            echo "Release tag $tag does not match Configuration.VERSION=$declared" >&2
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # A release must not publish what main would reject.
      - name: Verify build before publishing
        run: ./gradlew :weekview:jvmTest :weekview-compose:jvmTest

      # --no-configuration-cache: the vanniktech publish tasks are not yet
      # configuration-cache compatible; remove once they are.
      - name: Publish and release to Maven Central
        run: ./gradlew publishAndReleaseToMavenCentral --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
