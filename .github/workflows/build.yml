name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # macOS so the iOS klibs compile alongside JVM, Android and wasm.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Layout engine and Compose gesture tests
        run: ./gradlew :weekview:jvmTest :weekview-compose:jvmTest

      - name: Compile every published target
        run: ./gradlew :weekview:assemble :weekview-compose:assemble :sample:composeApp:assembleDebug
